name: "PR"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  semanticpr:
    name: "Semantic Pull Request"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-unit-tests:
    name: "Go Unit Tests (cart, orders, catalog)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check Go formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l src/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Test & Build Cart Service
        run: |
          cd src/cart && go vet ./... && go build -o dist/main . && go test -v -race ./...

      - name: Test & Build Orders Service
        run: |
          cd src/orders && go vet ./... && go build -o dist/main . && go test -v -race ./...

      - name: Test & Build Catalog Service
        run: |
          cd src/catalog && go vet ./... && go build -o dist/main main.go && go test -v ./...

  python-unit-tests:
    name: "Python Unit Tests (checkout, recommendations)"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Checkout Service
        run: |
          cd src/checkout && python3 -m py_compile main.py test_main.py app/*.py && python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements.txt && .venv/bin/python -m unittest discover -v

      - name: Test Recommendations Service
        run: |
          cd src/recommendations && python3 -m py_compile main.py test_main.py app/*.py && python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements.txt && .venv/bin/python -m unittest discover -v

  unit-tests:
    name: "Unit tests"
    needs: [go-unit-tests, python-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Unit Tests Passed
        run: echo "All Go and Python unit tests passed successfully."
