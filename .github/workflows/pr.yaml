name: "PR"

on:
  pull_request:
    branches:
      - main
      - development
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  semanticpr:
    name: "Semantic Pull Request"
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hooks:
    name: "Hooks"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Env
        uses: ./.github/actions/setup-env
      - name: Lint
        run: |
          git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | \
            yarn lefthook run pre-commit-ci --files-from-stdin

  test:
    name: "Project tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: "Setup Env"
        uses: ./.github/actions/setup-env
      - name: Build
        run: |
          yarn nx affected --targets=build --base origin/${{ github.base_ref }} --parallel 1
      - name: Other tasks
        run: |
          yarn nx affected --targets=lint,test:integration,test --base origin/${{ github.base_ref }}
      - name: Containers
        run: |
          yarn nx affected --targets=container --exclude='*,!tag:container' --base origin/${{ github.base_ref }}

  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: "Setup Env"
        uses: ./.github/actions/setup-env
      - name: Go Unit Tests (cart, orders, catalog)
        run: |
          (cd src/cart && go test -v -race ./...)
          (cd src/orders && go test -v -race ./...)
          (cd src/catalog && go test -v ./...)
      - name: Python Unit Tests (checkout, recommendations)
        run: |
          (cd src/checkout && python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements.txt && .venv/bin/python -m unittest discover -v)
          (cd src/recommendations && python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements.txt && .venv/bin/python -m unittest discover -v)
