apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgbouncer.fullname" . }}
  labels:
    {{- include "pgbouncer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 6432 }}
      targetPort: {{ .Values.service.targetPort | default 6432 }}
      protocol: TCP
      name: pgbouncer
  selector:
    {{- include "pgbouncer.selectorLabels" . | nindent 4 }}
