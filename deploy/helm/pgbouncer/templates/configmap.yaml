apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgbouncer.fullname" . }}-config
  labels:
    {{- include "pgbouncer.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.postgres.host | quote }}
  DB_PORT: {{ .Values.postgres.port | quote }}
  DB_NAME: {{ .Values.postgres.dbname | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  LISTEN_PORT: {{ .Values.pgbouncer.listen_port | quote }}
  POOL_MODE: {{ .Values.pgbouncer.pool_mode | quote }}
  MAX_CLIENT_CONN: {{ .Values.pgbouncer.max_client_conn | quote }}
  DEFAULT_POOL_SIZE: {{ .Values.pgbouncer.default_pool_size | quote }}
  MIN_POOL_SIZE: {{ .Values.pgbouncer.min_pool_size | quote }}
  RESERVE_POOL_SIZE: {{ .Values.pgbouncer.reserve_pool_size | quote }}
  MAX_DB_CONNECTIONS: {{ .Values.pgbouncer.max_db_connections | quote }}
  AUTH_TYPE: {{ .Values.pgbouncer.auth_type | quote }}
  AUTH_USER: {{ .Values.pgbouncer.auth_user | quote }}
  ADMIN_USERS: {{ .Values.pgbouncer.admin_users | quote }}
  STATS_USERS: {{ .Values.pgbouncer.stats_users | quote }}
  IGNORE_STARTUP_PARAMETERS: {{ .Values.pgbouncer.ignore_startup_parameters | quote }}
