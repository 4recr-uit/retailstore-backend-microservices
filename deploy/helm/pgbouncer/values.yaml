# Default values for pgbouncer.
# Stateless connection pooler standing in front of Amazon RDS PostgreSQL (db.t4g.micro)

replicaCount: 1

image:
  repository: edoburu/pgbouncer
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 6432
  targetPort: 6432

# Upstream Amazon RDS PostgreSQL target configuration
postgres:
  host: "retaildb-postgres.default.svc.cluster.local"
  port: 5432
  dbname: "retaildb"
  user: "postgres"
  password: "postgrespassword"

# PgBouncer connection pooling settings
pgbouncer:
  listen_port: 6432
  pool_mode: "transaction"
  max_client_conn: 600
  default_pool_size: 40
  min_pool_size: 5
  reserve_pool_size: 5
  max_db_connections: 50
  auth_type: "scram-sha-256"
  auth_user: "postgres"
  admin_users: "postgres"
  stats_users: "postgres"
  ignore_startup_parameters: "extra_float_digits"

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector:
  eks.amazonaws.com/nodegroup: managed-ng

tolerations: []

affinity: {}
