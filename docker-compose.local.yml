version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: retailstore-postgres
    environment:
      POSTGRES_DB: retaildb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retaildb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: retailstore-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/retaildb"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: retaildb
      DB_USER: postgres
      DB_PASSWORD: postgres
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "600"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres -d retaildb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: retailstore-mysql
    environment:
      MYSQL_DATABASE: catalogdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: default_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

  localstack:
    image: localstack/localstack:3
    container_name: retailstore-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    entrypoint:
      - sh
      - -c
      - |
        cat <<'EOF' > /etc/localstack/init/ready.d/init-sqs.sh
        #!/bin/bash
        set -e
        for dlq in cart-dlq orders-dlq checkout-dlq; do
          awslocal sqs create-queue --queue-name "$$dlq"
        done
        for svc in cart orders checkout; do
          dlq_arn=$$(awslocal sqs get-queue-attributes --queue-url "http://localhost:4566/000000000000/$${svc}-dlq" --attribute-names QueueArn --query 'Attributes.QueueArn' --output text)
          awslocal sqs create-queue --queue-name "$${svc}-queue" --attributes "{\"VisibilityTimeout\":\"60\",\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$${dlq_arn}\\\",\\\"maxReceiveCount\\\":\\\"3\\\"}\"}"
        done
        EOF
        chmod +x /etc/localstack/init/ready.d/init-sqs.sh
        exec docker-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues | grep -q orders-queue"]
      interval: 5s
      timeout: 5s
      retries: 15
