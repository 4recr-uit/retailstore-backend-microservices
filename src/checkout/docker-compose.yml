services:
  checkout:
    build:
      context: .
    hostname: checkout
    restart: always
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - APP_MODE=api
      - RETAIL_CHECKOUT_PERSISTENCE_PROVIDER=postgres
      - DB_HOST=checkout-db
      - DB_PORT=5432
      - DB_NAME=retaildb
      - DB_USER=checkout_user
      - DB_PASSWORD=${DB_PASSWORD:-test123}
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    depends_on:
      checkout-db:
        condition: service_healthy

  checkout-db:
    image: postgres:16-alpine
    hostname: checkout-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=retaildb
      - POSTGRES_USER=checkout_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-test123}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d retaildb -U checkout_user"]
      interval: 5s
      timeout: 5s
      retries: 10
