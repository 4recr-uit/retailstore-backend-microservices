services:
  ui:
    environment:
      - RETAIL_UI_ENDPOINTS_CATALOG=${RETAIL_UI_ENDPOINTS_CATALOG:-http://catalog:8080}
      - RETAIL_UI_ENDPOINTS_CARTS=${RETAIL_UI_ENDPOINTS_CARTS:-http://cart:8080}
      - RETAIL_UI_ENDPOINTS_ORDERS=${RETAIL_UI_ENDPOINTS_ORDERS:-http://orders:8080}
      - RETAIL_UI_ENDPOINTS_CHECKOUT=${RETAIL_UI_ENDPOINTS_CHECKOUT:-http://checkout:8080}
      - RETAIL_UI_ENDPOINTS_RECOMMENDATIONS=${RETAIL_UI_ENDPOINTS_RECOMMENDATIONS:-http://recommendations:8080}
    depends_on:
      catalog:
        condition: service_healthy
        restart: true
      cart:
        condition: service_healthy
        restart: true
      orders:
        condition: service_healthy
        restart: true
      checkout:
        condition: service_healthy
        restart: true
      recommendations:
        condition: service_healthy
        restart: true

  catalog:
    ports: !override []
  cart:
    ports: !override []
  carts-db:
    ports: !override []
  orders:
    ports: !override []
  orders-db:
    ports: !override []
  checkout:
    ports: !override []
  checkout-db:
    ports: !override []
  recommendations:
    ports: !override []
