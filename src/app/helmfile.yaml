releases:
  - name: "catalog"
    namespace: "default"
    chart: ../catalog/chart
    wait: true
    values:
      - templates/components.yaml.gotmpl
      - templates/catalog.yaml.gotmpl
      - nodeSelector: null
        app:
          persistence:
            provider: in-memory
        mysql:
          create: false

  - name: "carts"
    namespace: "default"
    chart: ../cart/chart
    wait: true
    values:
      - templates/components.yaml.gotmpl
      - templates/carts.yaml.gotmpl
      - database:
          host: ""
          secret:
            create: false
        api:
          replicaCount: 1
          nodeSelector: null
          serviceMonitor:
            enabled: false
        worker:
          enabled: false

  - name: "orders"
    namespace: "default"
    chart: ../orders/chart
    wait: true
    values:
      - templates/components.yaml.gotmpl
      - templates/orders.yaml.gotmpl
      - database:
          host: ""
          secret:
            create: false
        api:
          replicaCount: 1
          nodeSelector: null
          serviceMonitor:
            enabled: false
        worker:
          enabled: false

  - name: "checkout"
    namespace: "default"
    chart: ../checkout/chart
    wait: true
    values:
      - templates/components.yaml.gotmpl
      - templates/checkout.yaml.gotmpl
      - database:
          host: ""
          secret:
            create: false
        api:
          replicaCount: 1
          nodeSelector: null
          serviceMonitor:
            enabled: false
        worker:
          enabled: false

  - name: "ui"
    namespace: "default"
    chart: ../ui/chart
    wait: true
    timeout: 600
    values:
      - templates/components.yaml.gotmpl
      - templates/ui.yaml.gotmpl
      - templates/ingress.yaml.gotmpl
      - nodeSelector: null
        app:
          endpoints:
            catalog: http://catalog
            carts: http://carts
            checkout: http://checkout
            orders: http://orders
