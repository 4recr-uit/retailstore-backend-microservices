# Default values for recommendations service.

replicaCount: 1

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-recommendations
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 128m
    memory: 256Mi

nodeSelector:
  eks.amazonaws.com/nodegroup: managed-ng

tolerations: []

affinity: {}

configMap:
  create: true
  name: ""

app:
  persistence:
    provider: mysql
    endpoint: "catalogdb-mysql.default.svc.cluster.local:3306"
    database: "catalogdb"
    user: "catalog_user"
    connectTimeout: 5
    secret:
      create: true
      name: recommendations-db
      password: "default_password"

serviceMonitor:
  enabled: true
  scrapeInterval: 5s
  path: /metrics
  port: http
