{{- if and (eq .Values.app.persistence.provider "mysql") .Values.app.persistence.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recommendations.secretName" . }}
  labels:
    {{- include "recommendations.labels" . | nindent 4 }}
type: Opaque
data:
  RETAIL_RECOMMENDATIONS_PERSISTENCE_PASSWORD: {{ .Values.app.persistence.secret.password | b64enc | quote }}
{{- end }}
