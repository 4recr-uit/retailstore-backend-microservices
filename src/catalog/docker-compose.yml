services:
  catalog:
    build:
      context: .
    hostname: catalog
    depends_on:
      catalog-db:
        condition: service_healthy
        restart: true
    restart: always
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    environment:
      - GIN_MODE=release
      - reschedule=on-node-failure
      - RETAIL_CATALOG_PERSISTENCE_PROVIDER=${RETAIL_CATALOG_PERSISTENCE_PROVIDER:-mysql}
      - RETAIL_CATALOG_PERSISTENCE_PASSWORD=${MYSQL_PASSWORD:-${DB_PASSWORD:-test123}}
      - RETAIL_CATALOG_PERSISTENCE_ENDPOINT=${CATALOG_DB_ENDPOINT:-catalog-db:3306}
      - RETAIL_CATALOG_PERSISTENCE_DB_NAME=${MYSQL_DATABASE:-catalogdb}
      - RETAIL_CATALOG_PERSISTENCE_USER=${MYSQL_USER:-catalog_user}
      - RETAIL_CATALOG_SEARCH_ENABLED=${SEARCH_ENABLED:-false}
    ports:
      - "${CATALOG_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: .

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  catalog-db:
    image: mariadb:10.9
    hostname: catalog-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - reschedule=on-node-failure
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-test123}}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-catalogdb}
      - MYSQL_USER=${MYSQL_USER:-catalog_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-${DB_PASSWORD:-test123}}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
