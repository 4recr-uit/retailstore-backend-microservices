{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orders.fullname" . }}-worker
  labels:
    {{- include "orders.worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.externalAutoscaling }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "orders.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "orders.worker.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 90 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "orders.workerServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: orders-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.databaseTLS.enabled }}
            - name: DB_SSLMODE
              value: "verify-full"
            - name: DB_SSLROOTCERT
              value: /etc/rds-ca/global-bundle.pem
            {{- end }}
            - name: APP_MODE
              value: {{ .Values.worker.appMode | quote }}
            - name: WORKER_DB_MODE
              value: {{ .Values.worker.workerDbMode | quote }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.workerConcurrency | quote }}
            - name: SQS_MAX_MESSAGES
              value: {{ .Values.worker.sqsMaxMessages | quote }}
            - name: SQS_QUEUE_URL
              value: {{ .Values.worker.sqsQueueUrl | default .Values.sqs.queueUrl | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "orders.configMapName" . }}
            - secretRef:
                name: {{ include "orders.secretName" . }}
          {{- if .Values.databaseTLS.enabled }}
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- if .Values.databaseTLS.enabled }}
      volumes:
        - name: rds-ca
          configMap:
            name: {{ required "databaseTLS.caConfigMapName is required when TLS is enabled" .Values.databaseTLS.caConfigMapName | quote }}
            items:
              - key: global-bundle.pem
                path: global-bundle.pem
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
