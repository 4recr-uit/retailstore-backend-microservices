services:
  orders:
    build:
      context: .
    hostname: orders
    restart: always
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - APP_MODE=${ORDERS_APP_MODE:-api}
      - RETAIL_ORDERS_PERSISTENCE_PROVIDER=${RETAIL_ORDERS_PERSISTENCE_PROVIDER:-postgres}
      - DB_HOST=${ORDERS_DB_HOST-orders-db}
      - DB_PORT=${ORDERS_DB_CONNECTION_PORT:-5432}
      - DB_NAME=${ORDERS_DB_NAME:-orders}
      - DB_USER=${ORDERS_DB_USER:-orders_user}
      - DB_PASSWORD=${ORDERS_DB_PASSWORD:-${DB_PASSWORD:-test123}}
      - DB_SSLMODE=${ORDERS_DB_SSLMODE:-disable}
      - DATABASE_URL=${ORDERS_DATABASE_URL:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - SQS_QUEUE_URL=${ORDERS_SQS_QUEUE_URL:-}
      - SQS_MAX_MESSAGES=${SQS_MAX_MESSAGES:-1}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      - WORKER_DB_MODE=${WORKER_DB_MODE:-light}
    ports:
      - "${ORDERS_PORT:-8083}:8080"
    depends_on:
      orders-db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s

  orders-db:
    image: postgres:16-alpine
    hostname: orders-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=${ORDERS_DB_NAME:-orders}
      - POSTGRES_USER=${ORDERS_DB_USER:-orders_user}
      - POSTGRES_PASSWORD=${ORDERS_DB_PASSWORD:-${DB_PASSWORD:-test123}}
    ports:
      - "${ORDERS_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10
