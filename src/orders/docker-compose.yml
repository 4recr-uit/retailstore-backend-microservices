services:
  orders:
    build:
      context: .
    hostname: orders
    restart: always
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - APP_MODE=api
      - RETAIL_ORDERS_PERSISTENCE_PROVIDER=postgres
      - DB_HOST=orders-db
      - DB_PORT=5432
      - DB_NAME=orders
      - DB_USER=orders_user
      - DB_PASSWORD=${DB_PASSWORD:-test123}
      - DB_SSLMODE=disable
    ports:
      - "8083:8080"
    depends_on:
      orders-db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s

  orders-db:
    image: postgres:16-alpine
    hostname: orders-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=orders
      - POSTGRES_USER=orders_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-test123}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d orders -U orders_user"]
      interval: 5s
      timeout: 5s
      retries: 10
