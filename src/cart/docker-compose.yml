services:
  cart:
    build:
      context: .
    hostname: carts
    restart: always
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - APP_MODE=api
      - RETAIL_CART_PERSISTENCE_PROVIDER=postgres
      - DB_HOST=carts-db
      - DB_PORT=5432
      - DB_NAME=retaildb
      - DB_USER=cart_user
      - DB_PASSWORD=${DB_PASSWORD:-test123}
      - DB_SSLMODE=disable
    ports:
      - "8082:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      carts-db:
        condition: service_healthy

  carts-db:
    image: postgres:16-alpine
    hostname: carts-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=retaildb
      - POSTGRES_USER=cart_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-test123}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d retaildb -U cart_user"]
      interval: 5s
      timeout: 5s
      retries: 10
