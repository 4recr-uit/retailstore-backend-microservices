services:
  cart:
    build:
      context: .
    hostname: carts
    restart: always
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - APP_MODE=${CART_APP_MODE:-api}
      - RETAIL_CART_PERSISTENCE_PROVIDER=${RETAIL_CART_PERSISTENCE_PROVIDER:-postgres}
      - DB_HOST=${CART_DB_HOST-carts-db}
      - DB_PORT=${CART_DB_CONNECTION_PORT:-5432}
      - DB_NAME=${CART_DB_NAME:-retaildb}
      - DB_USER=${CART_DB_USER:-cart_user}
      - DB_PASSWORD=${CART_DB_PASSWORD:-${DB_PASSWORD:-test123}}
      - DB_SSLMODE=${CART_DB_SSLMODE:-disable}
      - DATABASE_URL=${CART_DATABASE_URL:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - SQS_QUEUE_URL=${CART_SQS_QUEUE_URL:-}
      - SQS_MAX_MESSAGES=${SQS_MAX_MESSAGES:-1}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      - WORKER_DB_MODE=${WORKER_DB_MODE:-light}
    ports:
      - "${CART_PORT:-8082}:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      carts-db:
        condition: service_healthy

  carts-db:
    image: postgres:16-alpine
    hostname: carts-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=${CART_DB_NAME:-retaildb}
      - POSTGRES_USER=${CART_DB_USER:-cart_user}
      - POSTGRES_PASSWORD=${CART_DB_PASSWORD:-${DB_PASSWORD:-test123}}
    ports:
      - "${CART_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10
