{{- if and .Values.api.enabled .Values.apiServiceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "carts.apiServiceAccountName" . }}
  labels:
    {{- include "carts.api.labels" . | nindent 4 }}
  {{- with .Values.apiServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.worker.enabled .Values.workerServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "carts.workerServiceAccountName" . }}
  labels:
    {{- include "carts.worker.labels" . | nindent 4 }}
  {{- with .Values.workerServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
