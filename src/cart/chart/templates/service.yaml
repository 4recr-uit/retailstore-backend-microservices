{{- if .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carts.fullname" . }}
  labels:
    {{- include "carts.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.api.service.port | default 80 }}
      targetPort: {{ .Values.api.service.targetPort | default 8080 }}
      protocol: TCP
      name: http
  selector:
    {{- include "carts.api.selectorLabels" . | nindent 4 }}
{{- end }}
