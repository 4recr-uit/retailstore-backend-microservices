# Default values for cart.
# Single Image – Dual Mode Deployment (API producer + Worker consumer)

image:
  repository: public.ecr.aws/aws-containers/retail-store-sample-cart
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# Shared Database Configuration (pointing to PgBouncer -> RDS PostgreSQL retaildb)
database:
  host: "pgbouncer"
  port: 6432
  name: "retaildb"
  schema: "cart"
  user: "postgres"
  password: "postgrespassword"
  sslmode: "disable"
  secret:
    create: true
    name: "cart-db"

# SQS Configuration
sqs:
  queueUrl: ""
  endpoint: ""
  region: "us-east-1"

configMap:
  create: true
  name: ""

# --- API Deployment (Producer / REST API) ---
api:
  enabled: true
  replicaCount: 2
  appMode: "api"
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 128m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  nodeSelector:
    eks.amazonaws.com/nodegroup: managed-ng
  tolerations: []
  affinity: {}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  serviceMonitor:
    enabled: true
    scrapeInterval: 5s
    path: /metrics
    port: http

# --- Worker Deployment (SQS Consumer / KEDA Scaled) ---
worker:
  enabled: true
  replicaCount: 0 # Scaled by KEDA (Scale-to-zero)
  appMode: "worker"
  terminationGracePeriodSeconds: 90
  workerDbMode: "light" # none | light | full
  workerConcurrency: "1"
  sqsMaxMessages: "1"
  sqsQueueUrl: "" # defaults to .Values.sqs.queueUrl
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 128m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  nodeSelector:
    karpenter.sh/nodepool: default
  tolerations:
    - key: "karpenter.sh/capacity-type"
      operator: "Exists"
      effect: "NoSchedule"
  affinity: {}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  serviceMonitor:
    enabled: true
    scrapeInterval: 5s
    path: /metrics
    port: http
  scaledObject:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 30
    pollingInterval: 5
    cooldownPeriod: 30
    scaleOnInFlight: "true"
    queueLength: "10"
    awsRegion: "us-east-1"
